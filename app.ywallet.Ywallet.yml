id: app.ywallet.Ywallet
runtime: org.freedesktop.Platform
runtime-version: "26.08"
sdk: org.freedesktop.Sdk
command: ywallet
rename-appdata-file: ywallet.metainfo.xml
rename-desktop-file: ywallet.desktop
rename-icon: icon
finish-args:
  - --share=ipc
  - --share=network
  - --socket=fallback-x11
  - --socket=wayland
  - --device=dri
modules:
  - name: zwallet
    buildsystem: simple
    build-commands:
      - mkdir /app/bin
      - cp -r * /app/bin
    sources:
      - type: archive
        url: https://github.com/hhanh00/zwallet/releases/download/v1.5.4/zwallet.tgz
        sha256: 5f3cc2331b31dd107aa9b470a161ce85723a7cb5f50d5f2a77c0e96e39f643e1
        strip-components: 0

  - name: misc
    buildsystem: simple
    build-commands:
      - cp libwarp_api_ffi.so /app/lib
      - mkdir -p /app/bin/.dart_tool/sqflite_common_ffi
      - install -Dm644 icon.png -t /app/share/icons/hicolor/256x256/apps/
      - install -Dm644 ywallet.desktop -t /app/share/applications/
      - install -Dm644 ywallet.metainfo.xml -t /app/share/metainfo/
    sources:
      - type: file
        url: https://github.com/hhanh00/zwallet/releases/download/v1.5.4/libwarp_api_ffi.so
        sha256: b4127ed3a3da14bdb3e491aed4b09eb1675bd756c132570e09315ee8353a18c8
      - type: file
        path: ywallet.desktop
      - type: file
        path: ywallet.metainfo.xml
      - type: file
        path: icon.png
